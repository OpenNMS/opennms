reports=onms.wsman.requests, \
onms.wsman.commands, \
onms.wsman.monitorPolls, \
onms.wsman.collections, \
onms.wsman.attributes, \
onms.wsman.eventlog.polls, \
onms.wsman.eventlog.records, \
onms.wsman.eventlog.targets

report.onms.wsman.requests.name=OpenNMS WS-Man Requests
report.onms.wsman.requests.columns=ONMSWsManReq,ONMSWsManReqFail
report.onms.wsman.requests.type=nodeSnmp, interfaceSnmp
report.onms.wsman.requests.command=--title="OpenNMS WS-Man Requests" \
 --vertical-label="Requests per second" \
 DEF:req={rrd1}:ONMSWsManReq:AVERAGE \
 DEF:fail={rrd2}:ONMSWsManReqFail:AVERAGE \
 AREA:req#A6CEE3 \
 LINE2:req#1F78B4:"Requests " \
 GPRINT:req:AVERAGE:" Avg  \\: %8.2lf %s" \
 GPRINT:req:MIN:"Min  \\: %8.2lf %s" \
 GPRINT:req:MAX:"Max  \\: %8.2lf %s\\n" \
 LINE2:fail#E31A1C:"Failures " \
 GPRINT:fail:AVERAGE:" Avg  \\: %8.2lf %s" \
 GPRINT:fail:MIN:"Min  \\: %8.2lf %s" \
 GPRINT:fail:MAX:"Max  \\: %8.2lf %s\\n"

