##############################################################################
##
##  Disclaimer: This configuration is a proof of concept. It evaluates how usable it is
##  to configure gNMI streaming telemetry metric processing. These files are not covered
##  by commercial service agreements.
##
##  Graphs for the attributes in etc/gnmi-datacollection-config.d/junos-linecard-environment.yaml.
##
##  Please add report definition in a new line to make it easier
##  for script based sanity checks
##
##################################################

reports=junos.fpc.power, \
junos.fpc.temperature, \
junos.fpc.voltage

#####
##### Junos line cards
#####

report.junos.fpc.power.name=Line Card Power (Junos)
report.junos.fpc.power.columns=fpcPower,fpcPowerMax
report.junos.fpc.power.type=ocComponent
report.junos.fpc.power.command=--title="Line Card Power" \
 --vertical-label="Watts" \
 --lower-limit 0 \
 DEF:power={rrd1}:fpcPower:AVERAGE \
 DEF:max={rrd2}:fpcPowerMax:AVERAGE \
 AREA:power#edd400 \
 LINE1:power#c4a000:"Used    " \
 GPRINT:power:AVERAGE:"Avg  \\: %8.2lf %s" \
 GPRINT:power:MIN:"Min  \\: %8.2lf %s" \
 GPRINT:power:MAX:"Max  \\: %8.2lf %s\\n" \
 LINE2:max#cc0000:"Budget  " \
 GPRINT:max:AVERAGE:"Avg  \\: %8.2lf %s\\n"

report.junos.fpc.temperature.name=Line Card Sensor Temperature (Junos)
report.junos.fpc.temperature.columns=fpcTemp
report.junos.fpc.temperature.type=junosFpcSensor
report.junos.fpc.temperature.command=--title="Line Card Sensor Temperature" \
 --vertical-label="Degrees Celsius" \
 DEF:temp={rrd1}:fpcTemp:AVERAGE \
 LINE2:temp#204a87:"Temperature" \
 GPRINT:temp:AVERAGE:"Avg  \\: %8.2lf %s" \
 GPRINT:temp:MIN:"Min  \\: %8.2lf %s" \
 GPRINT:temp:MAX:"Max  \\: %8.2lf %s\\n"

report.junos.fpc.voltage.name=Line Card Sensor Voltage (Junos)
report.junos.fpc.voltage.columns=fpcVoltage
report.junos.fpc.voltage.type=junosFpcSensor
report.junos.fpc.voltage.command=--title="Line Card Sensor Voltage" \
 --vertical-label="Volts" \
 DEF:mv={rrd1}:fpcVoltage:AVERAGE \
 CDEF:volts=mv,1000,/ \
 LINE2:volts#75507b:"Voltage" \
 GPRINT:volts:AVERAGE:"Avg  \\: %8.3lf" \
 GPRINT:volts:MIN:"Min  \\: %8.3lf" \
 GPRINT:volts:MAX:"Max  \\: %8.3lf\\n"
