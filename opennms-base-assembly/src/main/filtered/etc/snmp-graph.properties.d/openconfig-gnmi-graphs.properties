##### Interface egress queues
#####

report.openconfig.queue.packets.name=Queue Packets (OpenConfig)
report.openconfig.queue.packets.columns=qQueuedPkts
report.openconfig.queue.packets.type=ocIfQueue
report.openconfig.queue.packets.command=--title="Queue Packets" \
 --vertical-label="Packets per second" \
