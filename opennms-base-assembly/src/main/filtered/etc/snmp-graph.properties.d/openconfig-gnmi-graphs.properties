 AREA:pkts#73d216 \
 LINE1:pkts#4e9a06:"Queued" \
 GPRINT:pkts:AVERAGE:"Avg  \\: %8.2lf %s" \
 GPRINT:pkts:MIN:"Min  \\: %8.2lf %s" \
 GPRINT:pkts:MAX:"Max  \\: %8.2lf %s\\n"

report.openconfig.queue.bits.name=Queue Bits (OpenConfig)
report.openconfig.queue.bits.columns=qQueuedBytes
report.openconfig.queue.bits.type=ocIfQueue
report.openconfig.queue.bits.command=--title="Queue Bits" \
 --vertical-label="Bits per second" \
 DEF:bytes={rrd1}:qQueuedBytes:AVERAGE \
 CDEF:bits=bytes,8,* \
 AREA:bits#73d216 \
 LINE1:bits#4e9a06:"Queued" \
 GPRINT:bits:AVERAGE:"Avg  \\: %8.2lf %s" \
 GPRINT:bits:MIN:"Min  \\: %8.2lf %s" \
 GPRINT:bits:MAX:"Max  \\: %8.2lf %s\\n"

report.openconfig.queue.redDrops.name=Queue RED Drops (OpenConfig)
report.openconfig.queue.redDrops.columns=qHpRedDropPkts,qLpRedDropPkts
report.openconfig.queue.redDrops.type=ocIfQueue
report.openconfig.queue.redDrops.command=--title="Queue RED Drops" \
 --vertical-label="Packets per second" \
 DEF:hp={rrd1}:qHpRedDropPkts:AVERAGE \
 DEF:lp={rrd2}:qLpRedDropPkts:AVERAGE \
 AREA:hp#cc0000:"High priority" \
 GPRINT:hp:AVERAGE:"Avg  \\: %8.2lf %s" \
 GPRINT:hp:MIN:"Min  \\: %8.2lf %s" \
 GPRINT:hp:MAX:"Max  \\: %8.2lf %s\\n" \
 STACK:lp#fcaf3e:"Low priority " \
 GPRINT:lp:AVERAGE:"Avg  \\: %8.2lf %s" \
 GPRINT:lp:MIN:"Min  \\: %8.2lf %s" \
 GPRINT:lp:MAX:"Max  \\: %8.2lf %s\\n"

