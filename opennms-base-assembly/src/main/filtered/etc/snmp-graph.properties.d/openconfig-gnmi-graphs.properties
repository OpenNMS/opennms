report.openconfig.component.cpu.name=Component CPU (OpenConfig)
report.openconfig.component.cpu.columns=cpuInstant,cpuAvg
report.openconfig.component.cpu.type=ocComponent
report.openconfig.component.cpu.command=--title="Component CPU Utilization" \
 --vertical-label="Percent" \
 --lower-limit 0 --upper-limit 100 --rigid \
 DEF:instant={rrd1}:cpuInstant:AVERAGE \
 DEF:avg={rrd2}:cpuAvg:AVERAGE \
 AREA:instant#729fcf:"Instant" \
 GPRINT:instant:AVERAGE:"Avg  \\: %8.2lf %s" \
 GPRINT:instant:MIN:"Min  \\: %8.2lf %s" \
 GPRINT:instant:MAX:"Max  \\: %8.2lf %s\\n" \
 LINE2:avg#204a87:"Average" \
 GPRINT:avg:AVERAGE:"Avg  \\: %8.2lf %s" \
 GPRINT:avg:MIN:"Min  \\: %8.2lf %s" \
 GPRINT:avg:MAX:"Max  \\: %8.2lf %s\\n"

report.openconfig.component.temperature.name=Component Temperature (OpenConfig)
report.openconfig.component.temperature.columns=tempInstant,tempMin,tempMax,tempAlarmThresh
report.openconfig.component.temperature.type=ocComponent
report.openconfig.component.temperature.command=--title="Component Temperature" \
 --vertical-label="Degrees Celsius" \
 DEF:instant={rrd1}:tempInstant:AVERAGE \
 DEF:min={rrd2}:tempMin:AVERAGE \
 DEF:max={rrd3}:tempMax:AVERAGE \
 DEF:thresh={rrd4}:tempAlarmThresh:AVERAGE \
 LINE1:min#729fcf:"Minimum    " \
 GPRINT:min:MIN:"Min  \\: %8.2lf %s\\n" \
 LINE1:max#f57900:"Maximum    " \
 GPRINT:max:MAX:"Max  \\: %8.2lf %s\\n" \
 LINE2:instant#204a87:"Current    " \
 GPRINT:instant:AVERAGE:"Avg  \\: %8.2lf %s" \
 GPRINT:instant:MIN:"Min  \\: %8.2lf %s" \
 GPRINT:instant:MAX:"Max  \\: %8.2lf %s\\n" \
 LINE1:thresh#cc0000:"Alarm limit" \
 GPRINT:thresh:AVERAGE:"Avg  \\: %8.2lf %s\\n"

