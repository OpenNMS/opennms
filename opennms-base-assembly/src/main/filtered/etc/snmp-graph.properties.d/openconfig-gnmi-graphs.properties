report.openconfig.cpu.usage.name=CPU Usage (OpenConfig)
report.openconfig.cpu.usage.columns=cpuUser,cpuKernel,cpuSoftIrq,cpuTotal
report.openconfig.cpu.usage.type=ocCpu
