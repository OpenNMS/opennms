##############################################################################
##
##  Disclaimer: This configuration is a proof of concept. It evaluates how usable it is
##  to configure gNMI streaming telemetry metric processing. These files are not covered
##  by commercial service agreements.
##
##  Graphs for the attributes in the etc/gnmi-datacollection-config.d/openconfig-*.yaml files.
##  Interface counters use the MIB-2 names, so the stock mib2 graphs show them.
##
##  Please add report definition in a new line to make it easier
##  for script based sanity checks
##
##################################################

reports=openconfig.if.fcsErrors, \
openconfig.if.carrierTransitions, \
openconfig.queue.packets, \
openconfig.queue.bits, \
openconfig.queue.redDrops, \
openconfig.component.cpu, \
openconfig.component.temperature, \
openconfig.component.optics, \
openconfig.component.laserBias, \
openconfig.cpu.usage, \
openconfig.system.memory, \
openconfig.bgp.peer.transitions, \
openconfig.bgp.prefixes

#####
##### Interfaces
#####

report.openconfig.if.fcsErrors.name=FCS Errors In (OpenConfig)
report.openconfig.if.fcsErrors.columns=ocInFcsErrors
report.openconfig.if.fcsErrors.type=interfaceSnmp
report.openconfig.if.fcsErrors.command=--title="FCS Errors In" \
 --vertical-label="Frames per second" \
 DEF:fcs={rrd1}:ocInFcsErrors:AVERAGE \
 AREA:fcs#f57900 \
 LINE1:fcs#cc0000:"FCS errors" \
 GPRINT:fcs:AVERAGE:"Avg  \\: %8.2lf %s" \
 GPRINT:fcs:MIN:"Min  \\: %8.2lf %s" \
 GPRINT:fcs:MAX:"Max  \\: %8.2lf %s\\n"

report.openconfig.if.carrierTransitions.name=Carrier Transitions (OpenConfig)
report.openconfig.if.carrierTransitions.columns=ocCarrierTrans
report.openconfig.if.carrierTransitions.type=interfaceSnmp
report.openconfig.if.carrierTransitions.command=--title="Carrier Transitions" \
 --vertical-label="Transitions per hour" \
 DEF:trans={rrd1}:ocCarrierTrans:AVERAGE \
 CDEF:perHour=trans,3600,* \
 LINE2:perHour#cc0000:"Transitions" \
 GPRINT:perHour:AVERAGE:"Avg  \\: %8.2lf %s" \
 GPRINT:perHour:MIN:"Min  \\: %8.2lf %s" \
 GPRINT:perHour:MAX:"Max  \\: %8.2lf %s\\n"

