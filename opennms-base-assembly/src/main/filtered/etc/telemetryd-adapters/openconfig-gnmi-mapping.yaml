# Disclaimer: This configuration is a proof of concept. It evaluates how usable it is
# to configure gNMI streaming telemetry metric processing. These files are not covered
# by commercial service agreements.
#
# Declarative gNMI mapping read by openconfig-gnmi-mapping.groovy.
# To use it, set the OpenConfig adapter's script parameter in
# telemetryd-configuration.xml to openconfig-gnmi-mapping.groovy.
# Reference: OpenConfig telemetry docs, section "Declarative mapping".
#
# A group only sees the paths the connector subscribes to. The groups below
# were checked against a Juniper MX10004 with these connector paths:
#   origin openconfig:
#     /interfaces/interface, /components/component, /system/cpus,
#     /system/memory, /network-instances/network-instance/protocols/protocol/bgp
#   origin juniper:
#     /junos/system/linecard/environment
# Generic resource types used below are defined in
# etc/resource-types.d/openconfig-gnmi-resource.xml.
version: 1
aliases:
  if-counters: /interfaces/interface/state/counters
  if-state: /interfaces/interface/state
  if-out-queue: /interfaces/interface/state/counters/out-queue
  subif-counters: /interfaces/interface/subinterfaces/subinterface/state/counters
  cpu-utilization: /components/component/cpu/utilization/state
  temperature: /components/component/state/temperature
  transceiver: /components/component/transceiver/state
  system-cpu: /system/cpus/cpu/state
  system-memory: /system/memory/state
  # [identifier=*BGP] matches both BGP and openconfig-policy-types:BGP
  bgp-neighbor: /network-instances/network-instance/protocols/protocol[identifier=*BGP]/bgp/neighbors/neighbor/state
  bgp-prefixes: /network-instances/network-instance/protocols/protocol[identifier=*BGP]/bgp/neighbors/neighbor/afi-safis/afi-safi/state/prefixes
groups:
  # Names follow the SNMP MIB-2 names, so the stock interface graphs work unchanged
  - name: oc-if-counters
    match: if-counters
    resource-type: interface
    instance: "{interface.name}"
    attributes:
      in-octets: { type: counter, name: ifHCInOctets }
      out-octets: { type: counter, name: ifHCOutOctets }
      in-unicast-pkts: { type: counter, name: ifHCInUcastPkts }
      out-unicast-pkts: { type: counter, name: ifHCOutUcastPkts }
      in-multicast-pkts: { type: counter, name: ifHCInMulticastPkts }
      out-multicast-pkts: { type: counter, name: ifHCOutMulticastPkt }
      in-broadcast-pkts: { type: counter, name: ifHCInBroadcastPkts }
      out-broadcast-pkts: { type: counter, name: ifHCOutBroadcastPkt }
      in-errors: { type: counter, name: ifInErrors }
      out-errors: { type: counter, name: ifOutErrors }
      in-discards: { type: counter, name: ifInDiscards }
      out-discards: { type: counter, name: ifOutDiscards }
      in-fcs-errors: { type: counter, name: ocInFcsErrors }
      carrier-transitions: { type: counter, name: ocCarrierTrans }
  - name: oc-if-description
    match: if-state
    resource-type: interface
    instance: "{interface.name}"
    attributes:
      description: { type: string, name: ifAlias }
  # Groups may share a match path. Both groups below write to the same interface resource.
  - name: oc-if-status
    match: if-state
    resource-type: interface
    instance: "{interface.name}"
    attributes:
      oper-status: { type: string, name: ocOperStatus }
      admin-status: { type: string, name: ocAdminStatus }
      high-speed: { type: gauge, name: ifHighSpeed }
  # Logical units become interface resources named like the Junos unit,
  # e.g. xe-0/0/0.100 is stored as xe-0_0_0.100
  - name: oc-subif-counters
    match: subif-counters
    resource-type: interface
    instance: "{interface.name}.{subinterface.index}"
    attributes:
      in-octets: { type: counter, name: ifHCInOctets }
      out-octets: { type: counter, name: ifHCOutOctets }
      in-unicast-pkts: { type: counter, name: ifHCInUcastPkts }
      out-unicast-pkts: { type: counter, name: ifHCOutUcastPkts }
      in-multicast-pkts: { type: counter, name: ifHCInMulticastPkts }
      out-multicast-pkts: { type: counter, name: ifHCOutMulticastPkt }
  # One resource per egress queue, e.g. et-1_4_3_q5
  - name: oc-if-out-queue
    match: if-out-queue
    resource-type: ocIfQueue
    instance: "{interface.name}_q{out-queue.queue-number}"
    attributes:
      queued-pkts: { type: counter, name: qQueuedPkts }
      queued-bytes: { type: counter, name: qQueuedBytes }
      hp-red-drop-pkts: { type: counter, name: qHpRedDropPkts }
      lp-red-drop-pkts: { type: counter, name: qLpRedDropPkts }
  - name: oc-cpu
    match: cpu-utilization
    resource-type: ocComponent
    instance: "{component.name}"
    attributes:
      avg: { type: gauge, name: cpuAvg }
      instant: { type: gauge, name: cpuInstant }
  # Temperature and optics share the ocComponent resource with the CPU group
  - name: oc-temperature
    match: temperature
    resource-type: ocComponent
    instance: "{component.name}"
    attributes:
      instant: { type: gauge, name: tempInstant }
      avg: { type: gauge, name: tempAvg }
      min: { type: gauge, name: tempMin }
      max: { type: gauge, name: tempMax }
      alarm-status: { type: gauge, name: tempAlarm }  # boolean, stored as 1 or 0
      alarm-threshold: { type: gauge, name: tempAlarmThresh }
  # Attribute keys can be nested paths below the match path
  - name: oc-transceiver
    match: transceiver
    resource-type: ocComponent
    instance: "{component.name}"
    attributes:
      input-power/instant: { type: gauge, name: optRxPower }  # dBm
      output-power/instant: { type: gauge, name: optTxPower }  # dBm
      laser-bias-current/instant: { type: gauge, name: optLaserBias }  # mA
      present: { type: string, name: optPresent }
  - name: oc-system-cpu
    match: system-cpu
    resource-type: ocCpu
    instance: "{cpu.index}"
    attributes:
      total/instant: { type: gauge, name: cpuTotal }
      user/instant: { type: gauge, name: cpuUser }
      kernel/instant: { type: gauge, name: cpuKernel }
      software-interrupt/instant: { type: gauge, name: cpuSoftIrq }
      idle/instant: { type: gauge, name: cpuIdle }
  # Node-level attributes need no instance
  - name: oc-system-memory
    match: system-memory
    resource-type: node
    attributes:
      physical: { type: gauge, name: memPhysical }
      used: { type: gauge, name: memUsed }
      free: { type: gauge, name: memFree }
  # One resource per VRF and peer, e.g. DEFAULT_203.0.113.1
  - name: oc-bgp-peer
    match: bgp-neighbor
    resource-type: ocBgpPeer
    instance: "{network-instance.name}_{neighbor.neighbor-address}"
    attributes:
      session-state: { type: string, name: bgpSessionState }
      peer-as: { type: string, name: bgpPeerAs }
      peer-type: { type: string, name: bgpPeerType }
      established-transitions: { type: counter, name: bgpEstTransitions }
  # Three placeholders: VRF, peer and address family, e.g. DEFAULT_203.0.113.1_IPV4_UNICAST
  - name: oc-bgp-prefixes
    match: bgp-prefixes
    resource-type: ocBgpPeerAfi
    instance: "{network-instance.name}_{neighbor.neighbor-address}_{afi-safi.afi-safi-name}"
    attributes:
      received: { type: gauge, name: bgpPfxReceived }
      accepted: { type: gauge, name: bgpPfxAccepted }
      installed: { type: gauge, name: bgpPfxInstalled }
      sent: { type: gauge, name: bgpPfxSent }
      rejected: { type: gauge, name: bgpPfxRejected }
  # Junos native sensors, subscribed with origin juniper. A match can be a path instead of an alias.
  # Temperature sensor names already carry the line card, e.g. FPC0:EA0_TEMP_SENSOR.
  - name: junos-fpc-temp
    match: /junos/system/linecard/environment/temp-record
    resource-type: junosFpcSensor
    instance: "{temp-record.temp-sensor-name}"
    attributes:
      temp-value: { type: gauge, name: fpcTemp }
  # Voltage sensor names repeat on every line card, so the line card goes into the instance
  - name: junos-fpc-voltage
    match: /junos/system/linecard/environment/voltage-record
    resource-type: junosFpcSensor
    instance: "{linecard.name}_{voltage-record.voltage-sensor-name}"
    attributes:
      voltage-value: { type: gauge, name: fpcVoltage }  # mV
  # The line card name equals the OpenConfig component name, so power lands
  # on the same ocComponent resource as the line card's temperature
  - name: junos-fpc-power
    match: /junos/system/linecard/environment/power-record
    resource-type: ocComponent
    instance: "{linecard.name}"
    attributes:
      fpc-power: { type: gauge, name: fpcPower }  # W
      max-fpc-power: { type: gauge, name: fpcPowerMax }  # W
