# Disclaimer: This configuration is a proof of concept. It evaluates how usable it is
# to configure gNMI streaming telemetry metric processing. These files are not covered
# by commercial service agreements.
#
# Example: the behavior of the generic gNMI adapter script, written as a declarative mapping.
#
# The script walks every notification and derives the resource from the keyed path
# elements: /interfaces/interface[name=X] becomes interface X with COUNTER attributes,
# any other keyed element such as /components/component[name=X] becomes a generic
# resource with GAUGE attributes, and everything else lands on the node. It keeps
# every numeric leaf it finds.
#
# This mapping does the same with one group per subscribed container and
# "attributes: all". It is vendor neutral. To try it, copy this file to
# etc/gnmi-datacollection-config.d/ (the script merges every mapping file in that
# directory) and set the OpenConfig adapter's script parameter to
# openconfig-gnmi-mapping.groovy.
# The resource types ocComponent and ocCpu are defined in
# etc/resource-types.d/openconfig-gnmi-resource.xml.
#
# Differences to the script:
#   - Attribute names are the leaf path relative to "match", with "/" replaced by "-".
#     The script used the whole path, e.g. interfaces-interface-state-counters-in-octets.
#     Nested leaves still produce long names, e.g. temperature-alarm-threshold.
#     Add explicit attributes with "name:" to shorten them when you persist to RRD.
#   - The script converted port-speed strings such as SPEED_10GB to bytes per second.
#     The mapping keeps strings as strings. Collect high-speed (Mbit/s) as a gauge instead.
#   - The script read Juniper decimal64 objects of the form {digits, precision} as one
#     number. The mapping flattens them into two leaves, <leaf>-digits and <leaf>-precision.
#   - The script stored generic resources under the resource type requisitionMetrics
#     with instances such as component_name=FPC0. Here they use ocComponent and ocCpu
#     with the plain key value as instance, e.g. FPC0.
#   - There is no catch-all. A path that none of the groups below matches is dropped.
#     Add a group for every container the connector subscribes to.
version: 1
aliases:
  if-counters: /interfaces/interface/state/counters
  if-state: /interfaces/interface/state
  subif-counters: /interfaces/interface/subinterfaces/subinterface/state/counters
  component: /components/component
  system-cpu: /system/cpus/cpu/state
  system-memory: /system/memory/state
groups:
  # Every numeric leaf under counters becomes a COUNTER on the interface,
  # as the script did for all interface metrics.
  - name: gnmi-interfaces
    match: if-counters
    resource-type: interface
    instance: "{interface.name}"
    attributes: all
    default-type: counter
  # Leaves directly under state are gauges, not counters. Strings are listed
  # explicitly because "attributes: all" collects numeric leaves only.
  - name: gnmi-interfaces-state
    match: if-state
    resource-type: interface
    instance: "{interface.name}"
    attributes:
      ifindex: { type: gauge }
      mtu: { type: gauge }
      high-speed: { type: gauge }
      description: { type: string }
      oper-status: { type: string }
      admin-status: { type: string }
      port-speed: { type: string }
  # The script named these X;subinterface=N. The mapping needs an instance that
  # resource paths accept, so the Junos unit notation X.N is used.
  - name: gnmi-subinterfaces
    match: subif-counters
    resource-type: interface
    instance: "{interface.name}.{subinterface.index}"
    attributes: all
    default-type: counter
  # One generic resource per component, every numeric leaf below it as a gauge.
  # Deeper leaves get hyphenated names, e.g. state-temperature-instant,
  # cpu-utilization-state-avg.
  - name: gnmi-components
    match: component
    resource-type: ocComponent
    instance: "{component.name}"
    attributes: all
    default-type: gauge
  # /system/cpus/cpu[index=N] is keyed, so the script treated it as a generic resource too.
  # Matching the state container keeps names short, e.g. total-instant.
  - name: gnmi-system-cpu
    match: system-cpu
    resource-type: ocCpu
    instance: "{cpu.index}"
    attributes: all
    default-type: gauge
  # /system/memory has no key, so the script stored it on the node.
  - name: gnmi-node
    match: system-memory
    resource-type: node
    attributes: all
    default-type: gauge
