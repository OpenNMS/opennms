# Database connection configuration
# These variables are resolved by ${env:VAR|default} patterns in opennms-datasources.xml
# at both install time (bin/install) and runtime.  Setting them here ensures they work
# correctly even when the installer is invoked via sudo, which strips the environment.
#
#POSTGRES_HOST=localhost
#POSTGRES_PORT=5432
#OPENNMS_DBNAME=opennms
#POSTGRES_SSL_MODE=prefer
#POSTGRES_SSL_FACTORY=org.postgresql.ssl.LibPQFactory
#
# Database user credentials — resolved via SCV first, then these env vars, then defaults.
# See $OPENNMS_HOME/etc/opennms-datasources.xml for the full fallback chain.
#OPENNMS_DBUSER=opennms
#OPENNMS_DBPASS=opennms
#POSTGRES_USER=postgres
#POSTGRES_PASSWORD=
#
# Connection pool tuning
#OPENNMS_DATABASE_CONNECTION_IDLETIMEOUT=600
#OPENNMS_DATABASE_CONNECTION_LOGINTIMEOUT=3
#OPENNMS_DATABASE_CONNECTION_MINPOOL=25
#OPENNMS_DATABASE_CONNECTION_MAXPOOL=50
#OPENNMS_DATABASE_CONNECTION_MAXSIZE=50
