---
# Strike Fighter: OpenNMS microservice-mode deployment
# Core (daemons) + Webapp (JettyServer) + standalone Alarmd + Pollerd + Collectd
#
# Usage:
#   docker compose up -d
#   docker compose ps        # wait for all services to be healthy
#   open http://localhost:8980/opennms  (admin/admin)

services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: opennms
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: --auth=md5
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opennms -d opennms"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "16"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      CLUSTER_ID: "strike-fighter-kafka-cluster"
    volumes:
      - kafkadata:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  core:
    image: opennms/horizon:${VERSION}
    command: ["-s"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # Disable daemons that run as separate containers
      CORE_SERVICE_ALARMD_ENABLED: "false"
      CORE_SERVICE_JETTYSERVER_ENABLED: "false"
      CORE_SERVICE_POLLERD_ENABLED: "false"
      CORE_SERVICE_COLLECTD_ENABLED: "false"
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      OPENNMS_DBNAME: opennms
      OPENNMS_DBUSER: opennms
      OPENNMS_DBPASS: opennms
      # JVM
      JAVA_OPTS: >-
        -Xms1g -Xmx2g
        -XX:MaxMetaspaceSize=512m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=1
    volumes:
      - opennms-etc:/opt/opennms/etc
      - opennms-data:/opennms-data
      - ./core-overlay/etc/opennms-activemq.xml:/opt/opennms-etc-overlay/opennms-activemq.xml:ro
      - ./core-overlay/etc/opennms.properties.d/strike-fighter.properties:/opt/opennms-etc-overlay/opennms.properties.d/strike-fighter.properties:ro
      - ./core-overlay/etc/featuresBoot.d/strike-fighter.boot:/opt/opennms-etc-overlay/featuresBoot.d/strike-fighter.boot:ro
      - ./core-overlay/etc/org.opennms.features.kafka.producer.client.cfg:/opt/opennms-etc-overlay/org.opennms.features.kafka.producer.client.cfg:ro
      - ./core-overlay/etc/org.opennms.core.event.forwarder.kafka.cfg:/opt/opennms-etc-overlay/org.opennms.core.event.forwarder.kafka.cfg:ro
    ports:
      - "8101:8101"
      - "61616:61616"
    healthcheck:
      test: ["CMD-SHELL", "/opt/opennms/bin/opennms -v status | grep -q 'is running'"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  webapp:
    image: opennms/horizon:${VERSION}
    container_name: strike-fighter-webapp
    hostname: webapp
    command: ["-f"]
    depends_on:
      core:
        condition: service_healthy
    environment:
      TZ: America/New_York
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      OPENNMS_DBNAME: opennms
      OPENNMS_DBUSER: opennms
      OPENNMS_DBPASS: opennms
      JAVA_OPTS: >-
        -Xmx512m
        -XX:MaxMetaspaceSize=256m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=3
      # Disable ALL daemons except JettyServer (Manager + Eventd are always on)
      CORE_SERVICE_ALARMD_ENABLED: "false"
      CORE_SERVICE_BSMD_ENABLED: "false"
      CORE_SERVICE_TICKETER_ENABLED: "false"
      CORE_SERVICE_QUEUED_ENABLED: "false"
      CORE_SERVICE_ACTIOND_ENABLED: "false"
      CORE_SERVICE_NOTIFD_ENABLED: "false"
      CORE_SERVICE_SCRIPTD_ENABLED: "false"
      CORE_SERVICE_RTCD_ENABLED: "false"
      CORE_SERVICE_POLLERD_ENABLED: "false"
      CORE_SERVICE_ENHANCEDLINKD_ENABLED: "false"
      CORE_SERVICE_COLLECTD_ENABLED: "false"
      CORE_SERVICE_DISCOVERY_ENABLED: "false"
      CORE_SERVICE_VACUUMD_ENABLED: "false"
      CORE_SERVICE_EVENTTRANSLATOR_ENABLED: "false"
      CORE_SERVICE_PASSIVESTATUSD_ENABLED: "false"
      CORE_SERVICE_STATSD_ENABLED: "false"
      CORE_SERVICE_PROVISIOND_ENABLED: "false"
      CORE_SERVICE_ACKD_ENABLED: "false"
      CORE_SERVICE_SYSLOGD_ENABLED: "false"
      CORE_SERVICE_TELEMETRYD_ENABLED: "false"
      CORE_SERVICE_TRAPD_ENABLED: "false"
      CORE_SERVICE_PERSPECTIVEPOLLER_ENABLED: "false"
      # JettyServer + KarafStartupMonitor stay enabled (defaults)
    volumes:
      - webapp-etc:/opt/opennms/etc
      - webapp-data:/opennms-data
      - ./webapp-overlay/etc/opennms.properties.d/:/opt/opennms-etc-overlay/opennms.properties.d/
    ports:
      - "8980:8980"
      - "8102:8101"
    healthcheck:
      test: ["CMD", "curl", "-f", "-I", "http://localhost:8980/opennms/login.jsp"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  pollerd:
    image: opennms/daemon:${VERSION}
    container_name: strike-fighter-pollerd
    hostname: pollerd
    depends_on:
      core:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms512m -Xmx1g
        -XX:MaxMetaspaceSize=256m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=4
    volumes:
      - pollerd-data:/opt/daemon/data
      - ./pollerd-daemon-overlay:/opt/daemon-overlay:ro
    ports:
      - "8103:8201"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  collectd:
    image: opennms/horizon:${VERSION}
    container_name: strike-fighter-collectd
    hostname: collectd
    command: ["-f"]
    depends_on:
      core:
        condition: service_healthy
    environment:
      TZ: America/New_York
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      OPENNMS_DBNAME: opennms
      OPENNMS_DBUSER: opennms
      OPENNMS_DBPASS: opennms
      JAVA_OPTS: >-
        -Xms512m -Xmx1g
        -XX:MaxMetaspaceSize=256m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=5
      # Disable ALL daemons except Collectd (Manager + Eventd are always on)
      CORE_SERVICE_ALARMD_ENABLED: "false"
      CORE_SERVICE_BSMD_ENABLED: "false"
      CORE_SERVICE_TICKETER_ENABLED: "false"
      CORE_SERVICE_QUEUED_ENABLED: "false"
      CORE_SERVICE_ACTIOND_ENABLED: "false"
      CORE_SERVICE_NOTIFD_ENABLED: "false"
      CORE_SERVICE_SCRIPTD_ENABLED: "false"
      CORE_SERVICE_RTCD_ENABLED: "false"
      CORE_SERVICE_POLLERD_ENABLED: "false"
      CORE_SERVICE_ENHANCEDLINKD_ENABLED: "false"
      # CORE_SERVICE_COLLECTD_ENABLED defaults to "true"
      CORE_SERVICE_DISCOVERY_ENABLED: "false"
      CORE_SERVICE_VACUUMD_ENABLED: "false"
      CORE_SERVICE_EVENTTRANSLATOR_ENABLED: "false"
      CORE_SERVICE_PASSIVESTATUSD_ENABLED: "false"
      CORE_SERVICE_STATSD_ENABLED: "false"
      CORE_SERVICE_PROVISIOND_ENABLED: "false"
      CORE_SERVICE_ACKD_ENABLED: "false"
      CORE_SERVICE_JETTYSERVER_ENABLED: "false"
      CORE_SERVICE_SYSLOGD_ENABLED: "false"
      CORE_SERVICE_TELEMETRYD_ENABLED: "false"
      CORE_SERVICE_TRAPD_ENABLED: "false"
      CORE_SERVICE_PERSPECTIVEPOLLER_ENABLED: "false"
    volumes:
      - collectd-etc:/opt/opennms/etc
      - collectd-data:/opennms-data
      - ./collectd-overlay/etc/opennms.properties.d/:/opt/opennms-etc-overlay/opennms.properties.d/
      - ./collectd-overlay/etc/featuresBoot.d/strike-fighter.boot:/opt/opennms-etc-overlay/featuresBoot.d/strike-fighter.boot:ro
      - ./collectd-overlay/etc/org.opennms.features.kafka.producer.client.cfg:/opt/opennms-etc-overlay/org.opennms.features.kafka.producer.client.cfg:ro
      - ./collectd-overlay/etc/org.opennms.core.event.forwarder.kafka.cfg:/opt/opennms-etc-overlay/org.opennms.core.event.forwarder.kafka.cfg:ro
    ports:
      - "8104:8101"
    healthcheck:
      test: ["CMD-SHELL", "/opt/opennms/bin/opennms -v status | grep -q 'is running'"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  alarmd:
    image: opennms/alarmd:${VERSION}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "cp -a /opt/alarmd-overlay/* /opt/alarmd/ 2>/dev/null; exec /opt/alarmd/bin/karaf server"
    depends_on:
      core:
        condition: service_healthy
    environment:
      OPENNMS_BROKER_URL: failover:tcp://core:61616
      OPENNMS_HTTP_USER: admin
      OPENNMS_HTTP_PASS: admin
      OPENNMS_BROKER_USER: admin
      OPENNMS_BROKER_PASS: admin
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      OPENNMS_DBNAME: opennms
      OPENNMS_DBUSER: opennms
      OPENNMS_DBPASS: opennms
      JAVA_OPTS: >-
        -Xms512m -Xmx1g
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=2
    volumes:
      - alarmd-data:/opt/alarmd/data
      - ./alarmd-overlay:/opt/alarmd-overlay:ro
    ports:
      - "8201:8201"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  pgdata:
  kafkadata:
  opennms-etc:
  opennms-data:
  webapp-etc:
  webapp-data:
  pollerd-data:
  collectd-etc:
  collectd-data:
  alarmd-data:
