---
# Delta-V: OpenNMS microservice-mode deployment (18 services)
# Core (Eventd, Provisiond, Correlator)
# + Webapp + Alarmd + Pollerd + Collectd + Rtcd + PassiveStatusd + Notifd
# + Discovery + Trapd + Syslogd + Ticketer + EventTranslator + Enlinkd + Scriptd
#
# Usage:
#   docker compose up -d
#   docker compose ps        # wait for all services to be healthy
#   open http://localhost:8980/opennms  (admin/admin)

services:

  postgres:
    image: postgres:15
    command: ["-c", "max_connections=300"]
    environment:
      POSTGRES_DB: opennms
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: --auth=md5
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opennms -d opennms"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "16"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      CLUSTER_ID: "delta-v-kafka-cluster"
    volumes:
      - kafkadata:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  core:
    image: opennms/horizon:${VERSION}
    command: ["-s"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # Disable daemons that run as separate containers
      CORE_SERVICE_ALARMD_ENABLED: "false"
      CORE_SERVICE_POLLERD_ENABLED: "false"
      CORE_SERVICE_COLLECTD_ENABLED: "false"
      CORE_SERVICE_RTCD_ENABLED: "false"
      CORE_SERVICE_PASSIVESTATUSD_ENABLED: "false"
      CORE_SERVICE_NOTIFD_ENABLED: "false"
      # Discovery runs as standalone container — IPC events flow via AMQ
      CORE_SERVICE_DISCOVERY_ENABLED: "false"
      CORE_SERVICE_TRAPD_ENABLED: "false"
      CORE_SERVICE_SYSLOGD_ENABLED: "false"
      CORE_SERVICE_TICKETER_ENABLED: "false"
      CORE_SERVICE_EVENTTRANSLATOR_ENABLED: "false"
      CORE_SERVICE_ENHANCEDLINKD_ENABLED: "false"
      CORE_SERVICE_SCRIPTD_ENABLED: "false"
      CORE_SERVICE_BSMD_ENABLED: "false"
      CORE_SERVICE_PROVISIOND_ENABLED: "false"
      CORE_SERVICE_VACUUMD_ENABLED: "false"
      CORE_SERVICE_STATSD_ENABLED: "false"
      CORE_SERVICE_ACTIOND_ENABLED: "false"
      CORE_SERVICE_ACKD_ENABLED: "false"
      CORE_SERVICE_TELEMETRYD_ENABLED: "false"
      CORE_SERVICE_PERSPECTIVEPOLLER_ENABLED: "false"
      # JettyServer disabled — triggers Spring classloader conflict on this branch.
      # Without JettyServer, Karaf never starts (bootstrapped via WebAppListener),
      # so disable KarafStartupMonitor to prevent it from killing the JVM.
      # Core runs legacy daemons only (Eventd, ActiveMQ, Provisiond, etc.)
      CORE_SERVICE_JETTYSERVER_ENABLED: "false"
      CORE_SERVICE_KARAFSTARTUPMONITOR_ENABLED: "false"
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      OPENNMS_DBNAME: opennms
      OPENNMS_DBUSER: opennms
      OPENNMS_DBPASS: opennms
      # JVM
      JAVA_OPTS: >-
        -Xms1g -Xmx2g
        -XX:MaxMetaspaceSize=512m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=1
        -Dorg.opennms.kafka.bootstrap.servers=kafka:9092
        -Dorg.opennms.kafka.fault.topic=opennms-fault-events
        -Dorg.opennms.kafka.ipc.topic=opennms-ipc-events
        -Dorg.opennms.kafka.consumer.group=opennms-core-consumer
    volumes:
      - opennms-etc:/opt/opennms/etc
      - opennms-data:/opennms-data
      - ./core-overlay/etc/opennms-activemq.xml:/opt/opennms-etc-overlay/opennms-activemq.xml:ro
      - ./core-overlay/etc/opennms.properties.d/delta-v.properties:/opt/opennms-etc-overlay/opennms.properties.d/delta-v.properties:ro
      - ./core-overlay/etc/discovery-configuration.xml:/opt/opennms-etc-overlay/discovery-configuration.xml:ro
      - ./core-overlay/etc/snmp-config.xml:/opt/opennms-etc-overlay/snmp-config.xml:ro
      # Dev overlay: mount updated JARs for event architecture changes
      - ../../features/events/daemon/target/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:/opt/opennms/lib/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:ro
      - ../../opennms-provision/opennms-provisiond/target/opennms-provisiond-36.0.0-SNAPSHOT.jar:/opt/opennms/lib/opennms-provisiond-36.0.0-SNAPSHOT.jar:ro
      - ../../opennms-services/target/opennms-services-36.0.0-SNAPSHOT.jar:/opt/opennms/lib/opennms-services-36.0.0-SNAPSHOT.jar:ro
      - ../../features/discovery/target/org.opennms.features.discovery-36.0.0-SNAPSHOT.jar:/opt/opennms/lib/org.opennms.features.discovery-36.0.0-SNAPSHOT.jar:ro
    ports:
      - "8101:8101"
      - "61616:61616"
    healthcheck:
      # Without Karaf, 'opennms status' won't report running.
      # Check ActiveMQ TCP port instead (needed by daemon containers).
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/61616' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  webapp:
    image: opennms/horizon:${VERSION}
    container_name: delta-v-webapp
    hostname: webapp
    command: ["-f"]
    depends_on:
      core:
        condition: service_healthy
    environment:
      TZ: America/New_York
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      OPENNMS_DBNAME: opennms
      OPENNMS_DBUSER: opennms
      OPENNMS_DBPASS: opennms
      JAVA_OPTS: >-
        -Xms512m -Xmx1536m
        -XX:MaxMetaspaceSize=512m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=3
      # Disable ALL daemons except JettyServer (Manager + Eventd are always on)
      CORE_SERVICE_ALARMD_ENABLED: "false"
      CORE_SERVICE_BSMD_ENABLED: "false"
      CORE_SERVICE_TICKETER_ENABLED: "false"
      CORE_SERVICE_QUEUED_ENABLED: "false"
      CORE_SERVICE_ACTIOND_ENABLED: "false"
      CORE_SERVICE_NOTIFD_ENABLED: "false"
      CORE_SERVICE_SCRIPTD_ENABLED: "false"
      CORE_SERVICE_RTCD_ENABLED: "false"
      CORE_SERVICE_POLLERD_ENABLED: "false"
      CORE_SERVICE_ENHANCEDLINKD_ENABLED: "false"
      CORE_SERVICE_COLLECTD_ENABLED: "false"
      CORE_SERVICE_DISCOVERY_ENABLED: "false"
      CORE_SERVICE_VACUUMD_ENABLED: "false"
      CORE_SERVICE_EVENTTRANSLATOR_ENABLED: "false"
      CORE_SERVICE_PASSIVESTATUSD_ENABLED: "false"
      CORE_SERVICE_STATSD_ENABLED: "false"
      CORE_SERVICE_PROVISIOND_ENABLED: "false"
      CORE_SERVICE_ACKD_ENABLED: "false"
      CORE_SERVICE_SYSLOGD_ENABLED: "false"
      CORE_SERVICE_TELEMETRYD_ENABLED: "false"
      CORE_SERVICE_TRAPD_ENABLED: "false"
      CORE_SERVICE_PERSPECTIVEPOLLER_ENABLED: "false"
      # JettyServer + KarafStartupMonitor stay enabled (defaults)
    volumes:
      - webapp-etc:/opt/opennms/etc
      - webapp-data:/opennms-data
      - ./webapp-overlay/etc/:/opt/opennms-etc-overlay/:ro
      - ./webapp-overlay/system/:/opt/opennms-overlay/system/:ro
      - ./webapp-jetty-webinf-overlay/:/opt/opennms-jetty-webinf-overlay/
    ports:
      - "8980:8980"
      - "8102:8101"
    healthcheck:
      test: ["CMD", "curl", "-f", "-I", "http://localhost:8980/opennms/login.jsp"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  minion:
    image: opennms/minion:${VERSION}
    container_name: delta-v-minion
    hostname: minion-default-01
    depends_on:
      core:
        condition: service_healthy
      webapp:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      MINION_ID: minion-default-01
      MINION_LOCATION: Default
      OPENNMS_HTTP_URL: http://webapp:8980/opennms
      OPENNMS_HTTP_USER: admin
      OPENNMS_HTTP_PASS: admin
      KAFKA_IPC_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -Djava.security.egd=file:/dev/./urandom
    volumes:
      - minion-data:/opt/minion/data
      - ./webapp-overlay/system/org/opennms/karaf/opennms/36.0.0-SNAPSHOT/opennms-36.0.0-SNAPSHOT-features.xml:/opt/minion/repositories/core/org/opennms/karaf/opennms/36.0.0-SNAPSHOT/opennms-36.0.0-SNAPSHOT-features.xml:ro
      - ./webapp-overlay/system/org/opennms/karaf/opennms/36.0.0-SNAPSHOT/opennms-36.0.0-SNAPSHOT-features.xml:/opt/minion/repositories/default/org/opennms/karaf/opennms/36.0.0-SNAPSHOT/opennms-36.0.0-SNAPSHOT-features.xml:ro
      - ./webapp-overlay/system/org/opennms/org.opennms.core.messagebus.api/36.0.0-SNAPSHOT/org.opennms.core.messagebus.api-36.0.0-SNAPSHOT.jar:/opt/minion/repositories/core/org/opennms/org.opennms.core.messagebus.api/36.0.0-SNAPSHOT/org.opennms.core.messagebus.api-36.0.0-SNAPSHOT.jar:ro
      - ./webapp-overlay/system/org/opennms/org.opennms.core.messagebus.api/36.0.0-SNAPSHOT/org.opennms.core.messagebus.api-36.0.0-SNAPSHOT.jar:/opt/minion/repositories/default/org/opennms/org.opennms.core.messagebus.api/36.0.0-SNAPSHOT/org.opennms.core.messagebus.api-36.0.0-SNAPSHOT.jar:ro
    ports:
      - "8301:8201"
    healthcheck:
      test: ["CMD", "/health.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  pollerd:
    profiles: [lite, full]
    image: opennms/daemon:${VERSION}
    container_name: delta-v-pollerd
    hostname: pollerd
    depends_on:
      core:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:MaxMetaspaceSize=256m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=4
    volumes:
      - pollerd-data:/opt/sentinel/data
      - ./pollerd-daemon-overlay/etc:/opt/sentinel-etc-overlay:ro
      - ../../core/event-forwarder-kafka/target/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/core/org.opennms.core.event-forwarder-kafka/36.0.0-SNAPSHOT/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:ro
      - ../../container/features/target/classes/features.xml:/opt/sentinel/system/org/opennms/karaf/opennms/36.0.0-SNAPSHOT/opennms-36.0.0-SNAPSHOT-features.xml:ro
      - ../../features/events/daemon/target/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/features/events/org.opennms.features.events.daemon/36.0.0-SNAPSHOT/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:ro
    ports:
      - "8103:8181"
    healthcheck:
      # CXF servlet context is /sentinel (inherited from sentinel base)
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8181/sentinel/rest/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  collectd:
    profiles: [lite, full]
    image: opennms/daemon:${VERSION}
    container_name: delta-v-collectd
    hostname: collectd
    depends_on:
      core:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:MaxMetaspaceSize=256m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=5
    volumes:
      - collectd-data:/opt/sentinel/data
      - ./collectd-daemon-overlay/etc:/opt/sentinel-etc-overlay:ro
      - ../../core/event-forwarder-kafka/target/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/core/org.opennms.core.event-forwarder-kafka/36.0.0-SNAPSHOT/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:ro
      - ../../container/features/target/classes/features.xml:/opt/sentinel/system/org/opennms/karaf/opennms/36.0.0-SNAPSHOT/opennms-36.0.0-SNAPSHOT-features.xml:ro
      - ../../features/events/daemon/target/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/features/events/org.opennms.features.events.daemon/36.0.0-SNAPSHOT/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:ro
    ports:
      - "8104:8181"
    healthcheck:
      # CXF servlet context is /sentinel (inherited from sentinel base)
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8181/sentinel/rest/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  rtcd:
    profiles: [lite, full]
    image: opennms/daemon:${VERSION}
    container_name: delta-v-rtcd
    hostname: rtcd
    depends_on:
      core:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:MaxMetaspaceSize=256m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=6
    volumes:
      - rtcd-data:/opt/sentinel/data
      - ./rtcd-overlay/etc:/opt/sentinel-etc-overlay:ro
      - ../../core/event-forwarder-kafka/target/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/core/org.opennms.core.event-forwarder-kafka/36.0.0-SNAPSHOT/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:ro
      - ../../container/features/target/classes/features.xml:/opt/sentinel/system/org/opennms/karaf/opennms/36.0.0-SNAPSHOT/opennms-36.0.0-SNAPSHOT-features.xml:ro
      - ../../features/events/daemon/target/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/features/events/org.opennms.features.events.daemon/36.0.0-SNAPSHOT/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8181/sentinel/rest/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  passivestatusd:
    profiles: [full]
    image: opennms/daemon:${VERSION}
    container_name: delta-v-passivestatusd
    hostname: passivestatusd
    depends_on:
      core:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:MaxMetaspaceSize=256m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=7
    volumes:
      - passivestatusd-data:/opt/sentinel/data
      - ./passivestatusd-overlay/etc:/opt/sentinel-etc-overlay:ro
      - ../../core/event-forwarder-kafka/target/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/core/org.opennms.core.event-forwarder-kafka/36.0.0-SNAPSHOT/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:ro
      - ../../container/features/target/classes/features.xml:/opt/sentinel/system/org/opennms/karaf/opennms/36.0.0-SNAPSHOT/opennms-36.0.0-SNAPSHOT-features.xml:ro
      - ../../features/events/daemon/target/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/features/events/org.opennms.features.events.daemon/36.0.0-SNAPSHOT/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8181/sentinel/rest/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  notifd:
    profiles: [lite, full]
    image: opennms/daemon:${VERSION}
    container_name: delta-v-notifd
    hostname: notifd
    depends_on:
      core:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:MaxMetaspaceSize=256m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=8
    volumes:
      - notifd-data:/opt/sentinel/data
      - ./notifd-overlay/etc:/opt/sentinel-etc-overlay:ro
      - ../../core/event-forwarder-kafka/target/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/core/org.opennms.core.event-forwarder-kafka/36.0.0-SNAPSHOT/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:ro
      - ../../container/features/target/classes/features.xml:/opt/sentinel/system/org/opennms/karaf/opennms/36.0.0-SNAPSHOT/opennms-36.0.0-SNAPSHOT-features.xml:ro
      - ../../features/events/daemon/target/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/features/events/org.opennms.features.events.daemon/36.0.0-SNAPSHOT/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8181/sentinel/rest/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  discovery:
    profiles: [lite, full]
    image: opennms/daemon:${VERSION}
    container_name: delta-v-discovery
    hostname: discovery
    depends_on:
      core:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:MaxMetaspaceSize=256m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=9
    volumes:
      - discovery-data:/opt/sentinel/data
      - ./discovery-overlay/etc:/opt/sentinel-etc-overlay:ro
      - ../../core/event-forwarder-kafka/target/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/core/org.opennms.core.event-forwarder-kafka/36.0.0-SNAPSHOT/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:ro
      - ../../container/features/target/classes/features.xml:/opt/sentinel/system/org/opennms/karaf/opennms/36.0.0-SNAPSHOT/opennms-36.0.0-SNAPSHOT-features.xml:ro
      - ../../features/events/daemon/target/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/features/events/org.opennms.features.events.daemon/36.0.0-SNAPSHOT/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8181/sentinel/rest/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  trapd:
    profiles: [passive, full]
    image: opennms/daemon:${VERSION}
    container_name: delta-v-trapd
    hostname: trapd
    depends_on:
      core:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:MaxMetaspaceSize=256m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=10
