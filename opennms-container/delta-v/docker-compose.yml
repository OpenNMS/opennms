---
# Delta-V: OpenNMS microservice-mode deployment (18 services)
# db-init (schema migration, runs once) + Webapp + Minion
# + Alarmd + Pollerd + Collectd + Rtcd
# + Discovery + Trapd + Syslogd + Ticketer + EventTranslator + Enlinkd + Scriptd
# + Provisiond + Bsmd + PerspectivePollerd
#
# Usage:
#   docker compose up -d
#   docker compose ps        # wait for all services to be healthy
#   open http://localhost:8980/opennms  (admin/admin)

services:

  postgres:
    image: postgres:15
    command: ["-c", "max_connections=500"]
    environment:
      POSTGRES_DB: opennms
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: --auth=md5
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opennms -d opennms"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "16"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      CLUSTER_ID: "delta-v-kafka-cluster"
      KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - kafkadata:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Database schema initialization — standalone Spring Boot app that runs
  # Liquibase migrations, then exits. All services that need PostgreSQL
  # should depend on this with condition: service_completed_successfully.
  db-init:
    image: opennms/db-init:${VERSION}
    container_name: delta-v-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENNMS_DBINIT_ADMIN_URL: jdbc:postgresql://postgres:5432/template1
      OPENNMS_DBINIT_ADMIN_USER: opennms
      OPENNMS_DBINIT_ADMIN_PASSWORD: opennms
      OPENNMS_DBINIT_DATABASE_NAME: opennms
      OPENNMS_DBINIT_DATABASE_USER: opennms
      OPENNMS_DBINIT_DATABASE_PASSWORD: opennms
      OPENNMS_DBINIT_CREATE_USER: "false"
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m

  webapp:
    image: opennms/horizon:${VERSION}
    container_name: delta-v-webapp
    hostname: webapp
    command: ["-f"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      TZ: America/New_York
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      OPENNMS_DBNAME: opennms
      OPENNMS_DBUSER: opennms
      OPENNMS_DBPASS: opennms
      JAVA_OPTS: >-
        -Xms512m -Xmx1536m
        -XX:MaxMetaspaceSize=512m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=3
      # Disable ALL daemons except JettyServer (Manager + Eventd are always on)
      CORE_SERVICE_ALARMD_ENABLED: "false"
      CORE_SERVICE_BSMD_ENABLED: "false"
      CORE_SERVICE_TICKETER_ENABLED: "false"
      CORE_SERVICE_QUEUED_ENABLED: "false"
      CORE_SERVICE_ACTIOND_ENABLED: "false"
      CORE_SERVICE_SCRIPTD_ENABLED: "false"
      CORE_SERVICE_RTCD_ENABLED: "false"
      CORE_SERVICE_POLLERD_ENABLED: "false"
      CORE_SERVICE_ENHANCEDLINKD_ENABLED: "false"
      CORE_SERVICE_COLLECTD_ENABLED: "false"
      CORE_SERVICE_DISCOVERY_ENABLED: "false"
      CORE_SERVICE_VACUUMD_ENABLED: "false"
      CORE_SERVICE_EVENTTRANSLATOR_ENABLED: "false"
      CORE_SERVICE_STATSD_ENABLED: "false"
      CORE_SERVICE_PROVISIOND_ENABLED: "false"
      CORE_SERVICE_ACKD_ENABLED: "false"
      CORE_SERVICE_SYSLOGD_ENABLED: "false"
      CORE_SERVICE_TELEMETRYD_ENABLED: "false"
      CORE_SERVICE_TRAPD_ENABLED: "false"
      CORE_SERVICE_PERSPECTIVEPOLLER_ENABLED: "false"
      # JettyServer + KarafStartupMonitor stay enabled (defaults)
    volumes:
      - webapp-etc:/opt/opennms/etc
      - webapp-data:/opennms-data
      - ./webapp-overlay/etc/:/opt/opennms-etc-overlay/:ro
      - ./webapp-overlay/system/:/opt/opennms-overlay/system/:ro
      - ./webapp-jetty-webinf-overlay/:/opt/opennms-jetty-webinf-overlay/
      # Fix: updated system-report JAR (removed EventCountDaoHibernate bean)
      - ./webapp-overlay/lib/opennms_system_report.jar:/opt/opennms/lib/opennms_system_report.jar:ro
      # Fix: web.xml with notification servlets removed (Notifd eliminated)
      - ./webapp-jetty-webinf-overlay/web.xml:/opt/opennms/jetty-webapps/opennms/WEB-INF/web.xml:ro
    ports:
      - "8980:8980"
      - "8102:8101"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8980/opennms/rest/info || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  minion:
    image: opennms/minion:${VERSION}
    container_name: delta-v-minion
    hostname: minion-default-01
    depends_on:
      webapp:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      MINION_ID: minion-default-01
      MINION_LOCATION: Default
      KAFKA_IPC_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -Djava.security.egd=file:/dev/./urandom
    volumes:
      - minion-data:/opt/minion/data
      - ./webapp-overlay/system/org/opennms/org.opennms.core.messagebus.api/36.0.0-SNAPSHOT/org.opennms.core.messagebus.api-36.0.0-SNAPSHOT.jar:/opt/minion/repositories/core/org/opennms/org.opennms.core.messagebus.api/36.0.0-SNAPSHOT/org.opennms.core.messagebus.api-36.0.0-SNAPSHOT.jar:ro
      - ./webapp-overlay/system/org/opennms/org.opennms.core.messagebus.api/36.0.0-SNAPSHOT/org.opennms.core.messagebus.api-36.0.0-SNAPSHOT.jar:/opt/minion/repositories/default/org/opennms/org.opennms.core.messagebus.api/36.0.0-SNAPSHOT/org.opennms.core.messagebus.api-36.0.0-SNAPSHOT.jar:ro
      - ./webapp-overlay/system/org/opennms/org.opennms.core.tsid/36.0.0-SNAPSHOT/org.opennms.core.tsid-36.0.0-SNAPSHOT.jar:/opt/minion/repositories/core/org/opennms/org.opennms.core.tsid/36.0.0-SNAPSHOT/org.opennms.core.tsid-36.0.0-SNAPSHOT.jar:ro
      - ./webapp-overlay/system/org/opennms/org.opennms.core.tsid/36.0.0-SNAPSHOT/org.opennms.core.tsid-36.0.0-SNAPSHOT.jar:/opt/minion/repositories/default/org/opennms/org.opennms.core.tsid/36.0.0-SNAPSHOT/org.opennms.core.tsid-36.0.0-SNAPSHOT.jar:ro
      - ./minion-overlay/features.boot:/opt/minion/repositories/default/features.boot:ro
    ports:
      - "8301:8201"
      - "11162:1162/udp"
      - "1514:10514/udp"
    healthcheck:
      test: ["CMD", "/health.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  pollerd:
    profiles: [lite, full]
    image: opennms/daemon:${VERSION}
    container_name: delta-v-pollerd
    hostname: pollerd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms512m -Xmx1g
        -XX:MaxMetaspaceSize=512m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=4
        -Dorg.opennms.core.ipc.rpc.kafka.bootstrap.servers=kafka:9092
        -Dorg.opennms.core.ipc.rpc.force-remote=true
    volumes:
      - pollerd-data:/opt/sentinel/data
      - ./pollerd-daemon-overlay/etc:/opt/sentinel-etc-overlay:ro
      - ../../core/event-forwarder-kafka/target/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/core/org.opennms.core.event-forwarder-kafka/36.0.0-SNAPSHOT/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:ro
      - ../../container/features/target/classes/features.xml:/opt/sentinel/system/org/opennms/karaf/opennms/36.0.0-SNAPSHOT/opennms-36.0.0-SNAPSHOT-features.xml:ro
      - ../../features/events/daemon/target/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/features/events/org.opennms.features.events.daemon/36.0.0-SNAPSHOT/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:ro
    ports:
      - "8103:8181"
    healthcheck:
      # CXF servlet context is /sentinel (inherited from sentinel base)
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8181/sentinel/rest/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  collectd:
    profiles: [lite, full]
    image: opennms/daemon:${VERSION}
    container_name: delta-v-collectd
    hostname: collectd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms512m -Xmx1g
        -XX:MaxMetaspaceSize=512m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=5
        -Dorg.opennms.core.ipc.rpc.kafka.bootstrap.servers=kafka:9092
        -Dorg.opennms.core.ipc.rpc.force-remote=true
    volumes:
      - collectd-data:/opt/sentinel/data
      - ./collectd-daemon-overlay/etc:/opt/sentinel-etc-overlay:ro
      - ../../core/event-forwarder-kafka/target/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/core/org.opennms.core.event-forwarder-kafka/36.0.0-SNAPSHOT/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:ro
      - ../../container/features/target/classes/features.xml:/opt/sentinel/system/org/opennms/karaf/opennms/36.0.0-SNAPSHOT/opennms-36.0.0-SNAPSHOT-features.xml:ro
      - ../../features/events/daemon/target/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/features/events/org.opennms.features.events.daemon/36.0.0-SNAPSHOT/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:ro
    ports:
      - "8104:8181"
    healthcheck:
      # CXF servlet context is /sentinel (inherited from sentinel base)
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8181/sentinel/rest/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  rtcd:
    profiles: [lite, full]
    image: opennms/daemon:${VERSION}
    container_name: delta-v-rtcd
    hostname: rtcd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:MaxMetaspaceSize=256m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=6
    volumes:
      - rtcd-data:/opt/sentinel/data
      - ./rtcd-overlay/etc:/opt/sentinel-etc-overlay:ro
      - ../../core/event-forwarder-kafka/target/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/core/org.opennms.core.event-forwarder-kafka/36.0.0-SNAPSHOT/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:ro
      - ../../container/features/target/classes/features.xml:/opt/sentinel/system/org/opennms/karaf/opennms/36.0.0-SNAPSHOT/opennms-36.0.0-SNAPSHOT-features.xml:ro
      - ../../features/events/daemon/target/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/features/events/org.opennms.features.events.daemon/36.0.0-SNAPSHOT/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8181/sentinel/rest/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  discovery:
    profiles: [lite, full]
    image: opennms/daemon:${VERSION}
    container_name: delta-v-discovery
    hostname: discovery
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:MaxMetaspaceSize=256m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=9
        -Dorg.opennms.core.ipc.rpc.kafka.bootstrap.servers=kafka:9092
        -Dorg.opennms.core.ipc.rpc.force-remote=true
    volumes:
      - discovery-data:/opt/sentinel/data
      - ./discovery-overlay/etc:/opt/sentinel-etc-overlay:ro
      - ../../core/event-forwarder-kafka/target/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/core/org.opennms.core.event-forwarder-kafka/36.0.0-SNAPSHOT/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:ro
      - ../../container/features/target/classes/features.xml:/opt/sentinel/system/org/opennms/karaf/opennms/36.0.0-SNAPSHOT/opennms-36.0.0-SNAPSHOT-features.xml:ro
      - ../../features/events/daemon/target/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/features/events/org.opennms.features.events.daemon/36.0.0-SNAPSHOT/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8181/sentinel/rest/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  trapd:
    profiles: [passive, full]
    image: opennms/daemon:${VERSION}
    container_name: delta-v-trapd
    hostname: trapd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:MaxMetaspaceSize=256m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=10
        -Dorg.opennms.interface-node-cache.refresh-timer=15000
    volumes:
      - trapd-data:/opt/sentinel/data
      - ./trapd-overlay/etc:/opt/sentinel-etc-overlay:ro
      - ../../core/event-forwarder-kafka/target/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/core/org.opennms.core.event-forwarder-kafka/36.0.0-SNAPSHOT/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:ro
      - ../../container/features/target/classes/features.xml:/opt/sentinel/system/org/opennms/karaf/opennms/36.0.0-SNAPSHOT/opennms-36.0.0-SNAPSHOT-features.xml:ro
      - ../../features/events/daemon/target/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/features/events/org.opennms.features.events.daemon/36.0.0-SNAPSHOT/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:ro
      - ../../core/daemon-loader-trapd/target/org.opennms.core.daemon-loader-trapd-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/core/org.opennms.core.daemon-loader-trapd/36.0.0-SNAPSHOT/org.opennms.core.daemon-loader-trapd-36.0.0-SNAPSHOT.jar:ro
    ports:
      - "1162:10162/udp"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8181/sentinel/rest/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  syslogd:
    profiles: [passive, full]
    image: opennms/daemon:${VERSION}
    container_name: delta-v-syslogd
    hostname: syslogd
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:MaxMetaspaceSize=256m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=11
        -Dorg.opennms.core.ipc.sink.kafka.bootstrap.servers=kafka:9092
        -Dorg.opennms.core.ipc.sink.kafka.group.id=opennms-syslogd-sink
    volumes:
      - syslogd-data:/opt/sentinel/data
      - ./syslogd-overlay/etc:/opt/sentinel-etc-overlay:ro
      - ../../core/event-forwarder-kafka/target/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/core/org.opennms.core.event-forwarder-kafka/36.0.0-SNAPSHOT/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:ro
      - ../../container/features/target/classes/features.xml:/opt/sentinel/system/org/opennms/karaf/opennms/36.0.0-SNAPSHOT/opennms-36.0.0-SNAPSHOT-features.xml:ro
      - ../../features/events/daemon/target/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/features/events/org.opennms.features.events.daemon/36.0.0-SNAPSHOT/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:ro
      - ../../core/daemon-loader-syslogd/target/daemon-loader-syslogd-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/core/daemon-loader-syslogd/36.0.0-SNAPSHOT/daemon-loader-syslogd-36.0.0-SNAPSHOT.jar:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8181/sentinel/rest/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  ticketer:
    profiles: [full]
    image: opennms/daemon:${VERSION}
    container_name: delta-v-ticketer
    hostname: ticketer
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opennms
      POSTGRES_PASSWORD: opennms
      POSTGRES_DB: opennms
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
        -XX:MaxMetaspaceSize=256m
        -Djava.security.egd=file:/dev/./urandom
        -Dorg.opennms.tsid.node-id=12
    volumes:
      - ticketer-data:/opt/sentinel/data
      - ./ticketer-overlay/etc:/opt/sentinel-etc-overlay:ro
      - ../../core/event-forwarder-kafka/target/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/core/org.opennms.core.event-forwarder-kafka/36.0.0-SNAPSHOT/org.opennms.core.event-forwarder-kafka-36.0.0-SNAPSHOT.jar:ro
      - ../../container/features/target/classes/features.xml:/opt/sentinel/system/org/opennms/karaf/opennms/36.0.0-SNAPSHOT/opennms-36.0.0-SNAPSHOT-features.xml:ro
      - ../../features/events/daemon/target/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:/opt/sentinel/system/org/opennms/features/events/org.opennms.features.events.daemon/36.0.0-SNAPSHOT/org.opennms.features.events.daemon-36.0.0-SNAPSHOT.jar:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8181/sentinel/rest/health/probe || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  eventtranslator:
    profiles: [passive, full]
    image: opennms/daemon:${VERSION}
    container_name: delta-v-eventtranslator
