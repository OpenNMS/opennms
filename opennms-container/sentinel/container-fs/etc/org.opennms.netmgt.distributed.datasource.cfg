datasource.url = jdbc:postgresql://${env:POSTGRES_HOST:-localhost}:${env:POSTGRES_PORT:-5432}/${env:POSTGRES_DB:-opennms}
datasource.username = ${env:POSTGRES_USER:-postgres}
datasource.password = ${env:POSTGRES_PASSWORD:-}
datasource.databaseName = ${env:POSTGRES_DB:-opennms}
connection.pool.idleTimeout = ${env:OPENNMS_DATABASE_CONNECTION_IDLETIMEOUT:-600}
connection.pool.loginTimeout = ${env:OPENNMS_DATABASE_CONNECTION_LOGINTIMEOUT:-3}
connection.pool.minPool = ${env:OPENNMS_DATABASE_CONNECTION_MINPOOL:-50}
connection.pool.maxPool = ${env:OPENNMS_DATABASE_CONNECTION_MAXPOOL:-50}
connection.pool.maxSize = ${env:OPENNMS_DATABASE_CONNECTION_MAXSIZE:-50}
