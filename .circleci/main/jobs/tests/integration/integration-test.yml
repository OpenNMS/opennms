jobs:
  integration-test:
    executor: integration-test-executor
    parallelism: 8
    resource_class: large
    parameters:
      changes-only:
        type: boolean
        default: true
    steps:
      - cached-checkout
      - attach_workspace:
          at: ~/
      - run-integration-tests:
          rerun-failtest-count: 1
          changes-only: << parameters.changes-only >>
