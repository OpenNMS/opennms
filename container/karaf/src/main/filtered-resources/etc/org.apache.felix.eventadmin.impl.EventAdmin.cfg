# OPENNMS: Karaf's default sets AddSubject=true, which makes EventAdmin call
# Subject.getSubject(). That method always throws UnsupportedOperationException
# on JDK 23+, which breaks every event dispatch (and pax-logging posts each log
# record as an event). Felix' own default for AddSubject is false.
org.apache.felix.eventadmin.AddTimestamp=true
org.apache.felix.eventadmin.AddSubject=false
