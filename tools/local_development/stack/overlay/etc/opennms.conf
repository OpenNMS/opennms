# Enable remote JMX on 18980 so the self-monitoring that ships with OpenNMS
# actually has something to collect: collectd-configuration.xml package
# "opennms" polls OpenNMS-JVM over JSR-160 on 127.0.0.1:18980, and
# etc/foreign-sources/selfmonitor.xml detects it. Without this the stack starts
# clean but produces no JVM metrics.
#
# These lines are the commented-out block from etc/examples/opennms.conf.
# Authentication stays on: etc/jmx-config.xml authenticates as admin/admin
# against the OpenNMS users realm.
ADDITIONAL_MANAGER_OPTIONS="${ADDITIONAL_MANAGER_OPTIONS} -Dcom.sun.management.jmxremote.port=18980"
ADDITIONAL_MANAGER_OPTIONS="${ADDITIONAL_MANAGER_OPTIONS} -Dcom.sun.management.jmxremote.rmi.port=18980"
ADDITIONAL_MANAGER_OPTIONS="${ADDITIONAL_MANAGER_OPTIONS} -Dcom.sun.management.jmxremote.local.only=false"
ADDITIONAL_MANAGER_OPTIONS="${ADDITIONAL_MANAGER_OPTIONS} -Dcom.sun.management.jmxremote.ssl=false"
