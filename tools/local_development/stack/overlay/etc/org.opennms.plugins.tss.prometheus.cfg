# Prometheus RemoteWrite plugin -> VictoriaMetrics single-node.
# writeUrl and readUrl are required; the rest override plugin defaults.
writeUrl=http://victoriametrics:8428/api/v1/write
readUrl=http://victoriametrics:8428/prometheus/api/v1
maxConcurrentHttpConnections=100
# Raised from the plugin default of 1000ms: a cold container is slower to
# respond than a tuned host, and write timeouts drop samples.
writeTimeoutInMs=5000
readTimeoutInMs=5000
metricCacheSize=1000
externalTagsCacheSize=1000
