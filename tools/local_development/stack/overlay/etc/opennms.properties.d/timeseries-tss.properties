# Meta tags exposed to the time series store as labels on every metric.
#
# org.opennms.timeseries.strategy is deliberately NOT set here -- it comes from
# the OPENNMS_TIMESERIES_STRATEGY environment variable in compose.yaml, which
# the container renders into etc/opennms.properties.d/_confd.timeseries.properties.
# Setting it twice is what the documentation warns against.
org.opennms.timeseries.tin.metatags.tag.node=${node:label}
org.opennms.timeseries.tin.metatags.tag.location=${node:location}
org.opennms.timeseries.tin.metatags.tag.geohash=${node:geohash}
org.opennms.timeseries.tin.metatags.tag.ifDescr=${interface:if-description}
org.opennms.timeseries.tin.metatags.tag.ifName=${interface:if-name}

# Dev-friendly cache TTLs (seconds; both default to 300). The searcher cache is
# what the resource tree and graph lists are built from, so with the default a
# newly collected resource can take five minutes to appear in the UI even though
# the samples are already in the store. Raise these back up for anything
# resembling production -- short TTLs mean more queries against the store.
cache.timeseriesSearcherCache.expireAfterRead=30
cache.timeseriesPersisterMetaTagCache.expireAfterRead=30
