# Eclipse Transformer javax -> jakarta package rename rules.
#
# These rules are applied at build time by the transformer-maven-plugin to
# produce a fat JAR whose bytecode uses jakarta.* namespaces (required by
# Spring Boot 4 / Hibernate 6.x) while the shared source modules
# (opennms-model, opennms-dao-api, opennms-dao) remain on javax.* for
# backward compatibility with the Karaf / Hibernate 3.6 runtime.
#
# Format: javax.package=jakarta.package
#
# Only packages actually used in the OpenNMS codebase are listed here.
# The Eclipse Transformer also ships built-in Jakarta defaults
# (jakartaDefaults=true) which cover the full EE namespace; these
# explicit entries serve as documentation of what we rely on.

# JPA (Hibernate 6.x requires jakarta.persistence)
javax.persistence=jakarta.persistence

# CDI / DI
javax.inject=jakarta.inject

# Bean Validation
javax.validation=jakarta.validation

# Common Annotations (@PostConstruct, @PreDestroy, @Resource, etc.)
javax.annotation=jakarta.annotation

# Transactions (@Transactional on JTA)
javax.transaction=jakarta.transaction

# XML Binding (JAXB — needed if models use @XmlRootElement etc.)
javax.xml.bind=jakarta.xml.bind

# Servlet API (needed if any shared code references HttpServletRequest etc.)
javax.servlet=jakarta.servlet

# JAX-RS (CXF REST annotations — only if shared modules reference them)
javax.ws.rs=jakarta.ws.rs
